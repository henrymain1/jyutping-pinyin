<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jyutping &amp; Pinyin</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <span class="logo" aria-hidden="true">粵</span>
    <div>
      <h1>Jyutping &amp; Pinyin</h1>
      <p id="status" class="status"></p>
    </div>
  </header>

  <section class="specimen" aria-label="What to show">
    <span class="hz">行</span>
    <span class="hz">銀行</span>
    <span class="divider" aria-hidden="true"></span>
    <span></span>
    <span></span>

    <span class="py" data-row="pinyin">xíng</span>
    <span class="py" data-row="pinyin">yínháng</span>
    <label class="toggle-label" for="showPinyin" id="pinyin-toggle">Pinyin</label>
    <span class="switch big"><input type="checkbox" role="switch" id="showPinyin"><span class="track"></span></span>

    <span class="jp" data-row="jyutping" data-reading="hang4"></span>
    <span class="jp" data-row="jyutping" data-reading="ngan4 hong4"></span>
    <label class="toggle-label" for="showJyutping" id="jyutping-toggle">Jyutping</label>
    <span class="switch big"><input type="checkbox" role="switch" id="showJyutping"><span class="track"></span></span>
  </section>

  <section class="settings">
    <div class="row" id="site-row" hidden>
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5M12 3.5c-2.3 2.4-3.5 5.2-3.5 8.5s1.2 6.1 3.5 8.5"/></svg>
      </span>
      <label class="label" for="siteOn">This site <span id="site-name" class="note"></span></label>
      <span class="switch" id="site-switch"><input type="checkbox" role="switch" id="siteOn"><span class="track"></span></span>
      <button type="button" id="site-allow" class="allow" hidden>Allow</button>
    </div>

    <div class="row">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 12h3.5L9 6l4 12 2.5-6H21"/></svg>
      </span>
      <span class="label">Tones</span>
      <div class="seg" data-setting="toneStyle" role="radiogroup" aria-label="Tones">
        <button type="button" data-value="number">dung1</button>
        <button type="button" data-value="superscript">dung¹</button>
        <button type="button" data-value="color" aria-label="Colour by tone"><span class="dots"><i></i><i></i><i></i></span></button>
      </div>
    </div>

    <div class="row" id="layout-row">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h9M5 17h11"/></svg>
      </span>
      <span class="label">Position</span>
      <div class="seg" data-setting="layout" role="radiogroup" aria-label="Position">
        <button type="button" data-value="below">Below</button>
        <button type="button" data-value="inline">Beside</button>
      </div>
    </div>

    <div class="row">
      <span class="icon text" aria-hidden="true">Aa</span>
      <label class="label" for="scale">Size</label>
      <div class="range">
        <input type="range" id="scale" min="60" max="130" step="5">
        <output id="scale-out" for="scale"></output>
      </div>
    </div>

    <div class="row">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 3.5a8.5 8.5 0 1 0 0 17c1 0 1.7-.7 1.7-1.6 0-.5-.2-.8-.5-1.2-.3-.3-.5-.7-.5-1.1 0-.9.7-1.6 1.6-1.6h1.9a4.3 4.3 0 0 0 4.3-4.3C20.5 6.9 16.7 3.5 12 3.5z"/>
          <circle cx="7.6" cy="11.4" r="1.15" class="fill"/><circle cx="10" cy="7.6" r="1.15" class="fill"/><circle cx="14.4" cy="7.6" r="1.15" class="fill"/>
        </svg>
      </span>
      <span class="label">Colour</span>
      <div class="swatches" id="swatches" role="radiogroup" aria-label="Colour">
        <label class="custom" title="Any colour"><input type="color" id="custom-color" aria-label="Any colour"></label>
      </div>
    </div>

    <label class="row" data-tip="Some words have more than one Cantonese reading. This shows the extra ones, faded, after the main one: 生 sang1 / saang1.">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3.5 6c2.6-1.2 5.4-1 8.5.8v12.4c-3.1-1.8-5.9-2-8.5-.8V6zM20.5 6c-2.6-1.2-5.4-1-8.5.8v12.4c3.1-1.8 5.9-2 8.5-.8V6z"/></svg>
      </span>
      <span class="label">Other readings</span>
      <span class="switch"><input type="checkbox" role="switch" id="showAlternates"><span class="track"></span></span>
    </label>

    <label class="row" id="hear-row">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path d="M15.5 9.2a3.8 3.8 0 0 1 0 5.6M18 6.8a7.2 7.2 0 0 1 0 10.4"/></svg>
      </span>
      <span class="label">Click to hear <span id="voice-status" class="note" hidden>no Cantonese voice</span></span>
      <span class="switch"><input type="checkbox" role="switch" id="speakOnClick"><span class="track"></span></span>
    </label>
  </section>

  <section class="corrections" id="corrections" hidden>
    <h2>Corrections</h2>
    <ul id="corr-list"></ul>
  </section>

  <footer>
    <a href="https://cantonese.org" target="_blank" rel="noreferrer">CC-Canto</a>
  </footer>

  <script src="../src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
